<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OM Search — Independent Web Search Engine</title>
    <meta name="description" content="OM Search is an independent general-purpose web search engine with dedicated crawling, BM25 indexing, and relevance ranking." />
    <meta name="keywords" content="search engine, independent search engine, web crawler, private search, OM search, BM25 ranking, PageRank, knowledge discovery, real-time search, fast web search" />
    <meta name="author" content="OM Search Team" />
    <meta name="application-name" content="OM Search" />
    <meta name="apple-mobile-web-app-title" content="OM Search" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#a03b14" />
    <meta name="msapplication-TileColor" content="#a03b14" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="bingbot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="google-site-verification" content="google6ba000893a0dc8c1" />
    <link rel="canonical" href="https://omsearch.web.app/" />

    <!-- OpenSearch & PWA Webmanifest -->
    <link rel="search" type="application/opensearchdescription+xml" title="OM Search" href="/opensearch.xml" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OM Search" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://omsearch.web.app/" />
    <meta property="og:title" content="OM Search — Independent Web Search Engine" />
    <meta property="og:description" content="OM Search is an independent general-purpose web search engine with dedicated crawling, BM25 indexing, and relevance ranking." />
    <meta property="og:image" content="https://omsearch.web.app/favicon.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:alt" content="OM Search Engine" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@omsearch" />
    <meta name="twitter:creator" content="@omsearch" />
    <meta name="twitter:url" content="https://omsearch.web.app/" />
    <meta name="twitter:title" content="OM Search — Independent Web Search Engine" />
    <meta name="twitter:description" content="OM Search is an independent general-purpose web search engine with dedicated crawling, BM25 indexing, and relevance ranking." />
    <meta name="twitter:image" content="https://omsearch.web.app/favicon.svg" />
    <meta name="twitter:image:alt" content="OM Search Engine" />

    <!-- Schema.org Search Engine & Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://omsearch.web.app/#website",
            "url": "https://omsearch.web.app/",
            "name": "OM Search",
            "alternateName": ["OM Search Engine", "OM Web Search"],
            "description": "Independent general-purpose web search engine with dedicated crawling, BM25 indexing, and relevance ranking.",
            "publisher": {
              "@id": "https://omsearch.web.app/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://omsearch.web.app/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            },
            "inLanguage": "en-US"
          },
          {
            "@type": "Organization",
            "@id": "https://omsearch.web.app/#organization",
            "name": "OM Search Engine",
            "url": "https://omsearch.web.app/",
            "logo": "https://omsearch.web.app/favicon.svg",
            "sameAs": [
              "https://github.com/omprasad-007/OmSearch"
            ],
            "description": "An independent, transparent, and privacy-respecting general-purpose web search engine."
          },
          {
            "@type": "WebApplication",
            "@id": "https://omsearch.web.app/#webapp",
            "name": "OM Search",
            "applicationCategory": "SearchApplication",
            "operatingSystem": "All",
            "browserRequirements": "Requires JavaScript. Requires HTML5.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "description": "Fast, independent web search engine powered by custom crawling, PageRank, and BM25 relevance scoring."
          }
        ]
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Suppress Tailwind CDN production notice in development console -->
    <script>
      (function() {
        const _origWarn = console.warn;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
          _origWarn.apply(console, args);
        };
      })();
    </script>

    <!-- Tailwind CDN with Custom Editorial Theme -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#fbf9f5",
              "surface-bright": "#fbf9f5",
              "surface-dim": "#dbdad6",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f5f3f0",
              "surface-container": "#efeeea",
              "surface-container-high": "#e9e8e4",
              "surface-container-highest": "#e4e2df",
              "on-surface": "#1b1c1a",
              "on-surface-variant": "#57423b",
              primary: "#a03b14",
              "primary-container": "#c0532a",
              "on-primary": "#ffffff",
              secondary: "#5e5f5b",
              "secondary-container": "#e1e0db",
              "secondary-fixed": "#e4e2dd",
              "secondary-fixed-dim": "#c7c6c2",
              tertiary: "#37654d",
              "tertiary-container": "#507e65",
              "tertiary-fixed": "#bceecf",
              "tertiary-fixed-dim": "#a0d2b4",
              error: "#ba1a1a",
              outline: "#8a726a",
              "outline-variant": "#dec0b7",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Newsreader", "serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#fbf9f5] text-[#1b1c1a] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
